<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktik Perpustakaan</title>
    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-primary text-white p-4">
    <div class="container-fluid">
        <h1 class="h3 m-0">Website Praktik Perpustakaan</h1>
    </div>
</header>

<nav class="navbar navbar-expand-lg navbar-dark bg-info mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Navbar</a>
        <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
            <button class="btn btn-outline-light" type="submit">Search</button>
        </form>
    </div>
</nav>

<div class="container-fluid my-4">
    <div class="row min-vh-100">
        <aside class="col-md-3 mb-3">
            <div class="bg-white border rounded p-3 shadow-sm">
                <h2>Menu</h2>
                <ul class="list-group">
                    <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Dashboard</a></li>
                    <li class="list-group-item active"><a href="#" class="text-decoration-none text-white">Daftar Buku</a></li>
                    <li class="list-group-item"><a href="#" class="text-decoration-none text-dark">Form Peminjam</a></li>
                </ul>
            </div>
        </aside>

        <main class="col-md-9">
            <!-- Section Form Tambah/Edit -->
            <section class="border rounded p-4 bg-white shadow-sm mb-4">
                <h2 id="form-title">Tambah Buku</h2>
                <form id="form-buku" class="needs-validation" novalidate>
                    <input type="hidden" id="buku-id" value="" />
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="judul" class="form-label">Judul Buku</label>
                            <input type="text" class="form-control" id="judul" required minlength="3">
                            <div class="invalid-feedback">Minimal 3 karakter</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="penulis" class="form-label">Penulis</label>
                            <input type="text" class="form-control" id="penulis" required>
                            <div class="invalid-feedback">Isi Penulis</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="terbit" class="form-label">Tahun Terbit</label>
                            <input type="number" class="form-control" min="1900" max="2026" id="terbit" required>
                            <div class="invalid-feedback">Isi Tahun Terbit</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="stok" class="form-label">Stok</label>
                            <input type="number" class="form-control" min="0" step="1" id="stok" required>
                            <div class="invalid-feedback">Stok tidak boleh kosong</div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn-submit">Tambah Buku</button>
                    <button type="button" class="btn btn-secondary d-none ms-2" id="btn-batal" onclick="resetForm()">Batal</button>
                </form>
            </section>

            <!-- Section Tabel Daftar Buku -->
            <section class="border rounded p-4 bg-white shadow-sm">
                <h2>Daftar Buku</h2>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>No</th>
                                <th>Judul</th>
                                <th>Penulis</th>
                                <th>Tahun Terbit</th>
                                <th>Stok</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-buku">
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-4">
    <p class="mb-0">Copyright &copy; 2026 Website Praktik. All rights reserved.</p>
</footer>

<!-- JS Bootstrap 5 -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let daftarBuku = [
        { id: 1, judul: "Laskar Pelangi", penulis: "Andrea Hirata", terbit: 2005, stok: 3 },
        { id: 2, judul: "Roby Si Pengarang", penulis: "Roby Ariga", terbit: 2019, stok: 5 },
        { id: 3, judul: "Lutfi Penulis", penulis: "Lutfi Ghifari", terbit: 2021, stok: 7 }
    ];
    let nextId = 4;

    const formbuku = document.getElementById("form-buku");
    const formTitle = document.getElementById("form-title");
    const btnSubmit = document.getElementById("btn-submit");
    const btnBatal = document.getElementById("btn-batal");

    function renderDaftarBuku() {
        const tabelbuku = document.getElementById("tabel-buku");
        tabelbuku.innerHTML = "";

        if (daftarBuku.length === 0) {
            tabelbuku.innerHTML = `<tr><td colspan="6" class="text-center text-muted">Tidak ada data buku</td></tr>`;
            return;
        }

        daftarBuku.forEach((buku, index) => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${buku.judul}</td>
                <td>${buku.penulis}</td>
                <td>${buku.terbit}</td>
                <td>${buku.stok}</td>
                <td>
                    <button class="btn btn-sm btn-warning me-1" onclick="editBuku(${buku.id})">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="hapusBuku(${buku.id})">Hapus</button>
                </td>
            `;
            tabelbuku.appendChild(row);
        });
    }

    formbuku.addEventListener("submit", function(event) {
        event.preventDefault();
        if (!formbuku.checkValidity()) {
            event.stopPropagation();
            formbuku.classList.add("was-validated");
            return;
        }

        const id = document.getElementById("buku-id").value;
        const judul = document.getElementById("judul").value;
        const penulis = document.getElementById("penulis").value;
        const terbit = parseInt(document.getElementById("terbit").value);
        const stok = parseInt(document.getElementById("stok").value);

        if (id) {
            // Edit Data
            const index = daftarBuku.findIndex(b => b.id === parseInt(id));
            if (index !== -1) {
                daftarBuku[index] = { id: parseInt(id), judul, penulis, terbit, stok };
            }
        } else {
            // Tambah Data Baru
            daftarBuku.push({ id: nextId++, judul, penulis, terbit, stok });
        }

        resetForm();
        renderDaftarBuku();
    });

    function editBuku(id) {
        const buku = daftarBuku.find(b => b.id === id);
        if (buku) {
            document.getElementById("buku-id").value = buku.id;
            document.getElementById("judul").value = buku.judul;
            document.getElementById("penulis").value = buku.penulis;
            document.getElementById("terbit").value = buku.terbit;
            document.getElementById("stok").value = buku.stok;

            formTitle.textContent = "Edit Buku";
            btnSubmit.textContent = "Simpan Perubahan";
            btnBatal.classList.remove("d-none");
        }
    }

    function hapusBuku(id) {
        if (confirm("Apakah Anda yakin ingin menghapus buku ini?")) {
            daftarBuku = daftarBuku.filter(b => b.id !== id);
            renderDaftarBuku();
        }
    }

    function resetForm() {
        document.getElementById("buku-id").value = "";
        formbuku.reset();
        formbuku.classList.remove("was-validated");
        formTitle.textContent = "Tambah Buku";
        btnSubmit.textContent = "Tambah Buku";
        btnBatal.classList.add("d-none");
    }

    renderDaftarBuku();
</script>
</body>
</html>
